; Deployment example for the web PHP configuration, not loaded by Laravel.
; The UI sends Excel files in 512 KiB parts. 2M is a per-part PHP allowance,
; not a maximum size for the assembled Excel workbook.
upload_max_filesize = 2M
; Large reports are saved as JSON; do not cap the complete request body in PHP.
post_max_size = 0
max_execution_time = 0
max_input_time = -1
; Configure memory_limit according to actual server RAM and concurrency.
; The complete report and source shared strings still require working memory.
